schema: miakapp.project/1
home: my-home
control_plane: https://control.miakapp.com

# The household's interface: a whole-house application (miakapp.app/1) built
# from app/main.ts into one IIFE. Residents open it at the home_url that
# `miakapp publish` prints. To publish the semantic component in component/
# instead, replace this section with `component:` (artifact dist/component.js,
# built by `bun run build:component`), which may also declare its event.
app:
  artifact: dist/app.js
  release: 0.1.0
  # A request, not a grant: the coordinator in coordinator/home.ts decides per
  # resident, so every name here must also be covered there.
  requires:
    state_read:
      - climate.living_room.temperature
      - service.coordinator.health
      - zone.living_room.light.on
    call:
      - lighting.set

coordinator:
  entry: coordinator/main.ts
